name: Frontend build

on:
  push:
    branches:
      - main
      - fix/schedule-core-integrity
  pull_request:
    paths:
      - 'screator/**'
      - '.github/workflows/frontend-build.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: screator
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: screator/package-lock.json
      - run: npm ci
      - run: npm run build
